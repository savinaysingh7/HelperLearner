name: CI

on:
  push:
    branches: [main, master, Different_High_Version]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: helperlearner_test
          POSTGRES_USER: helperlearner
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://helperlearner:testpassword@localhost:5432/helperlearner_test
      CELERY_TASK_ALWAYS_EAGER: "True"
      ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Collect static files
        run: python manage.py collectstatic --no-input

      - name: Run migrations
        run: python manage.py migrate --no-input

      - name: Run test suite
        run: python manage.py test --verbosity=2
