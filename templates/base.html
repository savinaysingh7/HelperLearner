<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HelperLearner | Developer Help{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #2c3e50; }
        .navbar-brand { font-weight: bold; color: #ecf0f1 !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">HELPERLEARNER</a>
            <div class="ms-auto text-white">
                {% if user.is_authenticated %}
                    <span class="me-3">Points: <strong>{{ user.knowledge_points }}</strong></span>
                    <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm">Profile ({{ user.username }})</a>
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
                    <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Auto-dismiss flash messages after 4s
    document.addEventListener('DOMContentLoaded', function(){
        setTimeout(function(){
            document.querySelectorAll('.alert').forEach(function(a){
                var bsAlert = bootstrap.Alert.getOrCreateInstance(a);
                bsAlert.close();
            });
        }, 4000);

        // Prevent double submits: disable submit buttons and show spinner
        document.querySelectorAll('form').forEach(function(form){
            form.addEventListener('submit', function(e){
                var submit = form.querySelector('[type=submit]');
                if(submit){
                    submit.disabled = true;
                    var spinner = document.createElement('span');
                    spinner.className = 'spinner-border spinner-border-sm ms-2';
                    spinner.setAttribute('role','status');
                    spinner.setAttribute('aria-hidden','true');
                    submit.appendChild(spinner);
                }
            });
        });
    });
    </script>
</body>
</html>
